[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Multi-agent orchestration with LangGraph: supervisor delegation, typed tools, persistent memory and human-in-the-loop escalation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg[binary]",
  "psycopg-pool",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langgraph-checkpoint-sqlite",
  "chromadb",
  "redis",
  "celery[redis]",
  "anthropic",
  "openai",
  "structlog",
  "httpx",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
orchestrator-api = "orchestrator.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "N"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["orchestrator.worker.*"]
disallow_untyped_decorators = false
